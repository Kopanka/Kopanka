plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kopanka'
    compileSdk 35

    defaultConfig {
        // One-time new identity avoids replacing old independently signed MAP-002A.
        // This is never the production package com.kopanka.
        applicationId 'com.kopanka.maptest.stable'
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName '0.3.14-map005-estuary-grading'
    }

    signingConfigs {
        mapTestDebug {
            // Prepared from the versioned, PUBLIC, non-production debug keystore.
            // Never use this signing key for any release or production application.
            storeFile file('../ci/maptest-debug.keystore')
            storePassword 'android'
            keyAlias 'maptestdebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mapTestDebug
        }
    }
}
