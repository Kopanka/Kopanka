plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kopanka'
    compileSdk 35

    defaultConfig {
        // Separate test application: never replaces the existing com.kopanka install.
        applicationId 'com.kopanka.maptest'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2.0-maptest'
    }
}
