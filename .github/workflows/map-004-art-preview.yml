name: MAP-004 art preview PNG SVG pack

on:
  push:
    branches:
      - art/map-004-height-aware-preview
    paths:
      - 'docs/art/map-004-preview/**'
      - 'docs/art/map-005-natural-shore/**'
      - 'docs/art/map-005-height-faces/**'
      - 'docs/art/map-005-mixed-corners/**'
      - 'docs/art/map-005-water-cliffs/**'
      - 'docs/art/map-005-join-lab/**'
      - 'docs/art/map-005-organic-edge/**'
      - '.github/workflows/map-004-art-preview.yml'
  workflow_dispatch:

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Generate all editable SVG and PNG sprites
        run: python docs/art/map-004-preview/generate.py
      - name: Validate images, alpha and metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('docs/art/map-004-preview')
          obj=json.loads((root/'manifest.json').read_text())
          assert obj['geometry']['tileWidthPx']==128
          assert obj['geometry']['tileHeightPx']==64
          assert obj['geometry']['tileAnchor']==[64,32]
          assert obj['geometry']['cameraZoom']==1.2
          assert obj['geometry']['worldCols']==512
          assert len(obj['assets'])==27
          for a in obj['assets']:
              im=Image.open(root/a['path'])
              assert im.size==(a['widthPx'],a['heightPx'])
              assert im.mode=='RGBA'
              assert im.getchannel('A').getextrema()[0]==0
              assert (root/a['editableSource']).exists()
          print('PASS 27 sprite candidates + geometry + alpha + editable sources')
          PY
      - name: Validate every SVG PNG anchor hash and generate tile join diagnostic
        run: python docs/art/map-004-preview/validate_and_compose.py
      - name: Generate and validate all 16 coast adjacency masks
        run: |
          python docs/art/map-004-preview/generate_shoreline_masks.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from PIL import Image
          root=Path('docs/art/map-004-preview')
          m=json.loads((root/'shoreline_manifest.json').read_text())
          assert m['geometry']['tileWidthPx']==128
          assert m['geometry']['tileHeightPx']==64
          assert m['geometry']['anchor']==[64,32]
          assert m['geometry']['zoom']==1.2
          assert len(m['assets'])==16
          assert [a['adjacencyMask'] for a in m['assets']]==list(range(16))
          for a in m['assets']:
              p=root/a['path']
              im=Image.open(p)
              assert im.mode=='RGBA' and im.size==(128,64)
              assert a['anchorX']==64 and a['anchorY']==32
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              if a['adjacencyMask']:
                  assert im.getchannel('A').getextrema()[1]>0
              else:
                  assert im.getchannel('A').getextrema()==(0,0)
          print('PASS 16 coast masks; matching Android bit order, geometry, PNG and SHA256')
          PY
      - name: Generate and test MAP-005 organic shoreline candidates
        run: |
          python docs/art/map-005-natural-shore/generate.py
          python docs/art/map-005-natural-shore/test_shores.py
      - name: Generate and test MAP-005 level-1/5 height-aware cliff and corner candidates
        run: |
          python docs/art/map-005-height-faces/generate.py
          python docs/art/map-005-height-faces/test_faces.py
      - name: Generate and verify 90 mixed-height or mixed-material E-S corners
        run: |
          python docs/art/map-005-mixed-corners/generate.py
          python docs/art/map-005-mixed-corners/test_mixed.py
      - name: Generate and verify MAP-005 20 cliff-water transition prototypes
        run: |
          python docs/art/map-005-water-cliffs/generate.py
          python docs/art/map-005-water-cliffs/test_water_cliffs.py
      - name: Assemble actual 32x32 authored scene using reusable art sprites
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Assemble 32x32 authored scene with MAP-005 natural shore overlays
        env:
          MAP005_SHORE_VARIANT: natural
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Validate both scenes and authored geography identical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('docs/art/map-004-preview')
          old=json.loads((d/'scene_32x32_report.json').read_text())
          new=json.loads((d/'scene_32x32_natural_shore_report.json').read_text())
          assert old['shoreMaskCells']==new['shoreMaskCells']
          assert old['authoredRiverCells']==new['authoredRiverCells']==37
          assert old['objectsById']==new['objectsById']
          assert new['shoreCandidate']=='natural v2'
          print('PASS: old/new 32x32 geography, object and river counts identical')
          PY
      - name: Render integrated MAP-005 32x32 full terrain candidate
        env:
          MAP005_SCENE_VARIANT: integrated
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Assert authored world invariant and all cliff layers exercised
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/art/map-004-preview')
          baseline=json.loads((p/'scene_32x32_report.json').read_text())
          natural=json.loads((p/'scene_32x32_natural_shore_report.json').read_text())
          integrated=json.loads((p/'scene_32x32_integrated_candidate_report.json').read_text())
          for other in (natural,integrated):
              assert baseline['objectsById']==other['objectsById']
              assert baseline['authoredRiverCells']==other['authoredRiverCells']==37
              assert baseline['shoreMaskCells']==other['shoreMaskCells']
          assert integrated['sceneCandidate']=='integrated v6'
          assert sum(integrated['cliffAssetsUsed'].values())>0
          assert (p/'scene_32x32_integrated_candidate.jpg').stat().st_size>40000
          print('PASS: authored landmarks, geography, shores unchanged; cliff candidates rendered')
          print('Cliff candidates used:',integrated['cliffAssetsUsed'])
          PY
      - name: MAP-005 targeted visual diagnostic for absent joins
        run: |
          python docs/art/map-005-join-lab/render.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('docs/art/map-005-join-lab')
          r=json.loads((p/'join_lab_report.json').read_text())
          assert r['caseCount']==8
          assert sum(x['kind']=='water-cliff' for x in r['cases'])==4
          assert sum(x['kind']=='mixed' for x in r['cases'])==4
          assert r['geometry']['zoom']==1.2
          im=Image.open(p/'join_lab.png')
          assert im.size==(1300,910)
          print('PASS: 8 height-aware join inspection examples')
          PY
      - name: Render MAP-005 organic-height terrain v7 comparison
        env:
          MAP005_SCENE_VARIANT: organic
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Verify organic terrain changes geometry only visually
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          p=Path('docs/art/map-004-preview')
          old=json.loads((p/'scene_32x32_integrated_candidate_report.json').read_text())
          new=json.loads((p/'scene_32x32_organic_edge_v7_report.json').read_text())
          assert old['authoredRiverCells']==new['authoredRiverCells']==37
          assert old['shoreMaskCells']==new['shoreMaskCells']
          assert old['objectsById']==new['objectsById']
          assert new['sceneCandidate']=='organic edge v7'
          assert new['cliffAssetsUsed']['ordinary']>0
          img1=Image.open(p/'scene_32x32_integrated_candidate.jpg')
          img2=Image.open(p/'scene_32x32_organic_edge_v7.jpg')
          assert img1.size==img2.size
          assert ImageChops.difference(img1,img2).getbbox()
          print('PASS: same authored 32x32 geography, different terrain-edge pixels')
          PY
      - name: Render MAP-005 massif v8 mountain-top comparison
        env:
          MAP005_SCENE_VARIANT: massif
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Validate mountain massif demo map remains identical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('docs/art/map-004-preview')
          old=json.loads((root/'scene_32x32_organic_edge_v7_report.json').read_text())
          new=json.loads((root/'scene_32x32_massif_v8_report.json').read_text())
          assert new['sceneCandidate']=='massif v8'
          assert new['authoredRiverCells']==old['authoredRiverCells']==37
          assert new['objectsById']==old['objectsById']
          assert new['shoreMaskCells']==old['shoreMaskCells']
          assert new['massifGeometry']['geometry']=={'tileWidthPx':128,
               'tileHeightPx':64,'anchor':[64,32],'zoom':1.2}
          assert new['massifGeometry']['mountainCells']>0
          assert new['massifGeometry']['elevatedCells']>0
          a=Image.open(root/'scene_32x32_organic_edge_v7.jpg')
          b=Image.open(root/'scene_32x32_massif_v8.jpg')
          assert a.size==b.size
          assert ImageChops.difference(a,b).getbbox()
          print('PASS massif top rendering, fixed iso geometry, unchanged source data')
          PY
      - name: Render continuous relief v9
        env:
          MAP005_SCENE_VARIANT: continuous
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Verify v9 scene invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops
          p=Path('docs/art/map-004-preview')
          a=json.loads((p/'scene_32x32_massif_v8_report.json').read_text())
          b=json.loads((p/'scene_32x32_continuous_v9_report.json').read_text())
          assert b['sceneCandidate']=='continuous v9'
          for key in ('width','height','objectsById','authoredRiverCells','shoreMaskCells'):
              assert a[key]==b[key],key
          x=Image.open(p/'scene_32x32_massif_v8.jpg')
          y=Image.open(p/'scene_32x32_continuous_v9.jpg')
          assert x.size==y.size and ImageChops.difference(x,y).getbbox()
          print('PASS v9 scene invariants; visual approval still required')
          PY
      - name: Render textured v10
        env:
          MAP005_SCENE_VARIANT: textured
        run: python docs/art/map-004-preview/render_authored_scene.py
      - name: Verify v10 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops
          p=Path('docs/art/map-004-preview')
          a=json.loads((p/'scene_32x32_continuous_v9_report.json').read_text())
          b=json.loads((p/'scene_32x32_textured_v10_report.json').read_text())
          assert b['sceneCandidate']=='textured v10'
          for k in ('width','height','objectsById','authoredRiverCells','shoreMaskCells'):
              assert a[k]==b[k],k
          x=Image.open(p/'scene_32x32_continuous_v9.jpg')
          y=Image.open(p/'scene_32x32_textured_v10.jpg')
          assert x.size==y.size and ImageChops.difference(x,y).getbbox()
          PY
      - name: Check authored source geography unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/art/map-004-preview')
          j=json.loads((p/'demo_32x32.json').read_text())
          assert (j['width'],j['height'])==(32,32)
          assert len(j['riverPath'])==37
          assert j['riverPath'][0]=={'col':5,'row':3}
          assert j['riverPath'][-1]=={'col':24,'row':20}
          report=json.loads((p/'scene_32x32_report.json').read_text())
          assert report['authoredRiverCells']==37
          assert report['objectsById']['cave_entrance_small']==1
          assert report['objectsById']['mine_mountain_small']==1
          assert report['objectsById']['quarry_plain_01']==1
          assert report['objectsById']['settlement_hamlet_01']==1
          print('PASS original authored geography, river and landmarks preserved')
          PY
      - name: Upload test-only design ZIP and preview sheet
        uses: actions/upload-artifact@v4
        with:
          name: kopanka-map005-preview-run-${{ github.run_number }}
          path: |
            docs/art/map-004-preview/MAP-004-art-preview-v0.1.zip
            docs/art/map-004-preview/contact_sheet.png
            docs/art/map-004-preview/manifest.json
            docs/art/map-004-preview/tile_join_diagnostic.png
            docs/art/map-004-preview/validation_report.json
            docs/art/map-004-preview/scene_32x32_preview.jpg
            docs/art/map-004-preview/scene_32x32_report.json
            docs/art/map-004-preview/shoreline_manifest.json
            docs/art/map-004-preview/shoreline_16_preview.png
            docs/art/map-004-preview/shore_png/
            docs/art/map-005-natural-shore/manifest.json
            docs/art/map-005-natural-shore/preview_16.png
            docs/art/map-004-preview/scene_32x32_natural_shore.jpg
            docs/art/map-004-preview/scene_32x32_natural_shore_report.json
            docs/art/map-004-preview/scene_32x32_integrated_candidate.jpg
            docs/art/map-004-preview/scene_32x32_integrated_candidate_report.json
            docs/art/map-005-natural-shore/shore_png/
            docs/art/map-005-height-faces/manifest.json
            docs/art/map-005-height-faces/preview_20.png
            docs/art/map-005-height-faces/preview_corners_10.png
            docs/art/map-005-height-faces/cliff_png/
            docs/art/map-005-mixed-corners/manifest.json
            docs/art/map-005-mixed-corners/preview_16_mixed.png
            docs/art/map-005-mixed-corners/corner_png/
            docs/art/map-005-water-cliffs/manifest.json
            docs/art/map-005-water-cliffs/preview_20_water_cliffs.png
            docs/art/map-005-water-cliffs/water_cliff_png/
            docs/art/map-005-join-lab/join_lab.png
            docs/art/map-005-join-lab/join_lab_report.json
            docs/art/map-004-preview/scene_32x32_organic_edge_v7.jpg
            docs/art/map-004-preview/scene_32x32_organic_edge_v7_report.json
            docs/art/map-004-preview/scene_32x32_massif_v8.jpg
            docs/art/map-004-preview/scene_32x32_massif_v8_report.json
            docs/art/map-004-preview/scene_32x32_continuous_v9.jpg
            docs/art/map-004-preview/scene_32x32_continuous_v9_report.json
            docs/art/map-004-preview/scene_32x32_textured_v10.jpg
            docs/art/map-004-preview/scene_32x32_textured_v10_report.json
          if-no-files-found: error
          retention-days: 30
