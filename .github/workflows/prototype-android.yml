name: Prototype Android debug APK

on:
  push:
    paths:
      - 'prototype/android/**'
      - 'tools/validate_map_assets.py'
      - 'tools/test_validate_map_assets.py'
      - 'tools/test_map004_invariants.py'
      - 'tools/stage_map005_macros.py'
      - 'tools/test_map005_staging.py'
      - 'tools/test_map005_visual_regressions.py'
      - '.github/workflows/prototype-android.yml'
  pull_request:
    paths:
      - 'prototype/android/**'
      - 'tools/validate_map_assets.py'
      - 'tools/test_validate_map_assets.py'
      - 'tools/test_map004_invariants.py'
      - 'tools/stage_map005_macros.py'
      - 'tools/test_map005_staging.py'
      - 'tools/test_map005_visual_regressions.py'
      - '.github/workflows/prototype-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test MAP-003 asset manifest validator
        run: python3 tools/test_validate_map_assets.py
      - name: Validate MAP-004 fog and river rendering invariants
        run: python3 tools/test_map004_invariants.py
      - name: Validate artist assets when delivered
        shell: bash
        run: |
          if [ -f prototype/android/app/src/main/assets/map/manifest.json ]; then
            python3 tools/validate_map_assets.py prototype/android/app/src/main/assets/map/manifest.json
          else
            echo 'MAP-003: no artist manifest yet, Android placeholder renderer unchanged'
          fi
      - name: Validate complete MAP-003 v1.4 art package and demo geography
        shell: bash
        run: |
          if [ -f docs/art/map-003-v1.4/tools/validate_package.py ]; then
            python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
            python3 docs/art/map-003-v1.4/tools/validate_package.py
          fi
      - name: Validate MAP-005 staged PNG intake and reject premature production approval
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python3 tools/test_map005_staging.py
      - name: Check MAP-005 estuary, slope and fog visual regression guards
        run: python3 tools/test_map005_visual_regressions.py
      - name: Checkout PINNED approved MAP-005 source art archive
        uses: actions/checkout@v4
        with:
          repository: Kopanka/Kopanka
          ref: 6e1a5d63c713239833aeb41afa653fe3475710cb
          path: map005-art-source
          sparse-checkout: |
            docs/art/map-005-intake
      - name: Stage and verify real MAP-005 PNG artwork from GitHub
        shell: bash
        run: |
          set -euo pipefail
          ART=map005-art-source/docs/art/map-005-intake/KOPANKA_MAP005_art_handoff.zip
          echo '119a4cc301bbae83d024a6148af959489dc9f4e4e54d2f50408850ba2f7a3c16  '"${ART}" | sha256sum --check
          python3 tools/stage_map005_macros.py "${ART}" prototype/android/app/src/main/assets/map
          python3 tools/validate_map_assets.py prototype/android/app/src/main/assets/map/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('prototype/android/app/src/main/assets/map')
          index=json.loads((root/'manifest.json').read_text())
          ids={a['id'] for a in index['assets']}
          assert len(index['assets'])==70
          for required in ('map005_natural_cave_02','map005_forest_mix_01',
                           'map005_ridge_low_01','ground_grass_01'):
              assert required in ids
          print('PASS: 62 original tiles + 8 verified PNG macros; stable render fallback')
          PY
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare pinned TEST-ONLY debug signing keystore
        shell: bash
        run: |
          base64 --decode prototype/android/ci/maptest-debug.keystore.b64 > prototype/android/ci/maptest-debug.keystore
          echo '4b157ca10bb707571c5145587deced8a3850d3ff25731b7c4391e7d61000762a  prototype/android/ci/maptest-debug.keystore' | sha256sum --check
      - name: Build debug APK
        run: gradle --project-dir prototype/android :app:assembleDebug
      - name: Verify APK signing identity
        shell: bash
        run: |
          keytool -printcert -jarfile prototype/android/app/build/outputs/apk/debug/app-debug.apk > /tmp/maptest-cert.txt
          grep -F '6E:3F:1C:47:F5:D5:E0:15:68:60:21:60:6D:2B:BA:F9:A8:B2:39:2E:BA:1C:DD:9C:AE:4C:2E:11:03:6E:9D:29' /tmp/maptest-cert.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kopanka-maptest-stable-debug-apk
          path: prototype/android/app/build/outputs/apk/debug/app-debug.apk
