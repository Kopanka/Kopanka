name: Prototype Android debug APK

on:
  push:
    paths:
      - 'prototype/android/**'
      - '.github/workflows/prototype-android.yml'
  pull_request:
    paths:
      - 'prototype/android/**'
      - '.github/workflows/prototype-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --project-dir prototype/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kopanka-prototype-debug-apk
          path: prototype/android/app/build/outputs/apk/debug/app-debug.apk
